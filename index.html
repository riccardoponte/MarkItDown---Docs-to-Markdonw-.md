<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkItDown Web Pro - Layout Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.3s ease; border-radius: 1.5rem; }
        .drop-zone.drag-over { border-color: #3b82f6; background-color: #eff6ff; transform: scale(1.01); }
        #loader { display: none; }
        .prose h1 { color: #1e293b; font-weight: 800; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .prose h2 { color: #334155; font-weight: 700; margin-top: 2rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="max-w-6xl mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-slate-900 mb-3 tracking-tight">MarkItDown <span class="text-blue-600">Pro</span></h1>
            <p class="text-slate-500 text-lg">Analisi intelligente del layout per PDF e documenti Office</p>
        </header>

        <main class="space-y-8">
            <div id="dropZone" class="drop-zone bg-white p-16 text-center cursor-pointer shadow-xl border-2 transition-all">
                <div class="flex flex-col items-center">
                    <div class="bg-blue-600 p-5 rounded-2xl mb-6 shadow-lg shadow-blue-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                    <p class="text-2xl font-bold text-slate-800">Trascina i file per la conversione</p>
                    <p class="text-slate-400 mt-2 font-medium">PDF con rilevamento titoli, Word, Excel, PPTX, OCR Immagini</p>
                    <input type="file" id="fileInput" class="hidden" multiple>
                </div>
            </div>

            <div id="loader" class="bg-white rounded-2xl p-8 shadow-lg border border-blue-100">
                <div class="flex items-center gap-6">
                    <div class="animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
                    <div class="flex-1">
                        <p class="text-lg font-bold text-slate-700" id="statusText">Analisi del layout in corso...</p>
                        <div class="w-full bg-slate-100 h-3 rounded-full mt-3 overflow-hidden">
                            <div id="progressBar" class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="resultArea" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <div class="flex justify-between items-center px-2">
                        <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">Markdown Source</span>
                        <button id="copyBtn" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-slate-700 transition shadow-md">Copia</button>
                    </div>
                    <div class="bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
                        <pre class="p-6 text-sm text-slate-300 font-mono h-[650px] overflow-auto leading-relaxed"><code id="markdownOutput"></code></pre>
                    </div>
                </div>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center px-2">
                        <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">Live Preview</span>
                        <button id="downloadBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-500 transition shadow-md">Scarica .md</button>
                    </div>
                    <div class="bg-white rounded-2xl overflow-hidden shadow-xl border border-slate-200 h-[650px] overflow-auto">
                        <div id="markdownPreview" class="p-12 prose prose-slate max-w-none prose-headings:font-bold prose-h1:text-3xl prose-h2:text-2xl"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const turndownService = new TurndownService({ headingStyle: 'atx', hr: '---', bulletListMarker: '-' });
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const resultArea = document.getElementById('resultArea');
        const markdownOutput = document.getElementById('markdownOutput');
        const markdownPreview = document.getElementById('markdownPreview');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
        dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            if (files.length === 0) return;
            showLoader(true);
            let fullMarkdown = "";
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                updateStatus(`Analisi ${file.name}...`, (i / files.length) * 100);
                try {
                    const content = await processFile(file);
                    fullMarkdown += `\n# File: ${file.name}\n\n${content}\n\n---\n`;
                } catch (err) {
                    fullMarkdown += `\n# Errore in ${file.name}\n\nImpossibile convertire: ${err.message}\n\n---\n`;
                }
            }
            displayResult(fullMarkdown);
            showLoader(false);
        }

        async function processFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();

            // PDF CON ANALISI LAYOUT
            if (ext === 'pdf') {
                updateStatus(`Analisi struttura PDF: ${file.name}...`);
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";
                
                // Calcolo dimensione media font per euristica
                let allItems = [];
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    allItems.push(...content.items);
                }
                
                const avgFontSize = allItems.reduce((acc, item) => acc + (item.transform[0] || 12), 0) / (allItems.length || 1);
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    let lastY = -1;
                    let pageText = "";
                    
                    // Ordina per coordinata Y (dall'alto in basso) e poi X
                    const sortedItems = content.items.sort((a, b) => {
                        if (Math.abs(a.transform[5] - b.transform[5]) < 5) return a.transform[4] - b.transform[4];
                        return b.transform[5] - a.transform[5];
                    });

                    sortedItems.forEach(item => {
                        const fontSize = item.transform[0];
                        const currentY = item.transform[5];
                        let prefix = "";
                        let suffix = "";

                        // Se c'è un salto di riga significativo
                        if (lastY !== -1 && Math.abs(lastY - currentY) > fontSize * 1.2) {
                            pageText += "\n\n";
                        } else if (lastY !== -1 && Math.abs(lastY - currentY) > 5) {
                            pageText += "\n";
                        } else if (lastY !== -1) {
                            pageText += " ";
                        }

                        // Euristica Titoli
                        if (fontSize > avgFontSize * 1.5) {
                            prefix = "## ";
                            suffix = "\n";
                        } else if (fontSize > avgFontSize * 1.2) {
                            prefix = "### ";
                            suffix = "\n";
                        }

                        pageText += prefix + item.str + suffix;
                        lastY = currentY;
                    });
                    fullText += pageText + "\n\n---\n\n";
                }
                return fullText.trim() || "Nessun testo rilevato.";
            }

            // PPTX CON ANALISI SLIDE
            if (ext === 'pptx') {
                const zip = await JSZip.loadAsync(file);
                let md = "";
                const slideFiles = Object.keys(zip.files).filter(name => name.startsWith('ppt/slides/slide') && name.endsWith('.xml')).sort((a, b) => {
                    return parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]);
                });
                
                for (let i = 0; i < slideFiles.length; i++) {
                    const content = await zip.files[slideFiles[i]].async("string");
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(content, "text/xml");
                    
                    // Distingui titoli (p:title) e corpo testo
                    const titles = Array.from(xmlDoc.getElementsByTagName("p:nvSpPr")).map(node => {
                        const isTitle = node.querySelector('p:ph[type="title"], p:ph[type="ctrTitle"]');
                        if (isTitle) {
                            const sp = node.closest('p:sp');
                            return Array.from(sp.getElementsByTagName("a:t")).map(t => t.textContent).join("");
                        }
                        return null;
                    }).filter(t => t);

                    const allTexts = Array.from(xmlDoc.getElementsByTagName("a:t")).map(t => t.textContent).join(" ");
                    
                    md += `## Slide ${i + 1}: ${titles[0] || 'Senza Titolo'}\n\n`;
                    if (titles[0]) {
                        const bodyText = allTexts.replace(titles[0], "").trim();
                        md += bodyText + "\n\n";
                    } else {
                        md += allTexts + "\n\n";
                    }
                }
                return md;
            }

            // WORD (.docx)
            if (ext === 'docx') {
                const result = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
                return turndownService.turndown(result.value);
            } 

            // IMMAGINI (OCR)
            if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
                updateStatus(`OCR in corso su ${file.name}...`);
                const worker = await Tesseract.createWorker('ita+eng');
                const ret = await worker.recognize(file);
                await worker.terminate();
                return `## Risultato OCR Immagine\n\n${ret.data.text}`;
            }

            // EXCEL
            if (ext === 'xlsx' || ext === 'xls') {
                const workbook = XLSX.read(await file.arrayBuffer());
                return workbook.SheetNames.map(name => `## Foglio: ${name}\n\n${csvToMd(XLSX.utils.sheet_to_csv(workbook.Sheets[name]))}`).join("\n\n");
            }

            if (ext === 'csv') return csvToMd(await file.text());
            if (ext === 'json') return "```json\n" + await file.text() + "\n```";
            return await file.text();
        }

        function csvToMd(csv) {
            const data = Papa.parse(csv, { header: false }).data;
            if (!data || !data.length) return "";
            let md = "| " + data[0].join(" | ") + " |\n| " + data[0].map(() => "---").join(" | ") + " |\n";
            for (let i = 1; i < data.length; i++) if (data[i].some(c => c.toString().trim() !== "")) md += "| " + data[i].join(" | ") + " |\n";
            return md;
        }

        function showLoader(show) {
            loader.style.display = show ? 'block' : 'none';
            if (show) { resultArea.classList.add('hidden'); progressBar.style.width = '0%'; }
        }

        function updateStatus(text, progress) {
            statusText.innerText = text;
            if (progress !== undefined) progressBar.style.width = progress + '%';
        }

        function displayResult(md) {
            resultArea.classList.remove('hidden');
            markdownOutput.textContent = md;
            markdownPreview.innerHTML = marked.parse(md);
            hljs.highlightAll();
        }

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(markdownOutput.textContent);
            alert('Copiato!');
        };

        document.getElementById('downloadBtn').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([markdownOutput.textContent], { type: 'text/markdown' }));
            a.download = 'export_markdown.md';
            a.click();
        };
    </script>
</body>
</html>
